# Default: Munshi against Hindsight Cloud (set HINDSIGHT_API_KEY and LLM_API_KEY in .env).
#   docker compose up --build
#
# Fully self-hosted: also start the open-source Hindsight server (uses your Groq key for extraction).
#   HINDSIGHT_URL=http://hindsight:8888 docker compose --profile selfhost up --build
services:
  munshi:
    build: .
    env_file: .env
    environment:
      HINDSIGHT_URL: ${HINDSIGHT_URL:-https://api.hindsight.vectorize.io}
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]

  hindsight:
    profiles: ["selfhost"]
    image: ghcr.io/vectorize-io/hindsight:latest
    environment:
      HINDSIGHT_API_LLM_PROVIDER: groq
      HINDSIGHT_API_LLM_API_KEY: ${LLM_API_KEY}
      HINDSIGHT_API_LLM_MODEL: openai/gpt-oss-120b
      HINDSIGHT_API_LLM_GROQ_SERVICE_TIER: on_demand
    ports: ["8888:8888", "9999:9999"]
    volumes: ["hindsight-data:/home/hindsight/.pg0"]

volumes:
  hindsight-data:
