<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#fcfcfb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker>
  </defs>
  <g fill="#0b0b0b">
    <rect x="20" y="60" width="150" height="74" rx="10" fill="#fff" stroke="#e2e0d8"/>
    <text x="95" y="90" text-anchor="middle" font-weight="600">Invoice + PO + GRN</text>
    <text x="95" y="110" text-anchor="middle" fill="#52514e" font-size="12">+ GSTR-2B extract</text>

    <rect x="210" y="40" width="190" height="114" rx="10" fill="#fff" stroke="#e2e0d8"/>
    <text x="305" y="64" text-anchor="middle" font-weight="600">1 · AP controls (code)</text>
    <text x="305" y="86" text-anchor="middle" fill="#52514e" font-size="12">3-way match · GSTIN checksum</text>
    <text x="305" y="104" text-anchor="middle" fill="#52514e" font-size="12">GSTR-2B · IGST vs CGST/SGST</text>
    <text x="305" y="122" text-anchor="middle" fill="#52514e" font-size="12">duplicates · TDS · MSME 43B(h)</text>
    <text x="305" y="142" text-anchor="middle" fill="#d03b3b" font-size="11">hard stops force HOLD</text>

    <rect x="440" y="40" width="200" height="114" rx="10" fill="#fff" stroke="#e2e0d8"/>
    <text x="540" y="64" text-anchor="middle" font-weight="600">3 · Decide (LLM via Groq)</text>
    <text x="540" y="86" text-anchor="middle" fill="#52514e" font-size="12">action + payment basis</text>
    <text x="540" y="104" text-anchor="middle" fill="#52514e" font-size="12">reasons cite memory ids</text>
    <text x="540" y="122" text-anchor="middle" fill="#52514e" font-size="12">draft vendor email</text>
    <text x="540" y="142" text-anchor="middle" fill="#52514e" font-size="11">amounts computed in code</text>

    <rect x="680" y="40" width="260" height="114" rx="10" fill="#fff" stroke="#e2e0d8"/>
    <text x="810" y="64" text-anchor="middle" font-weight="600">4 · Reviewer (AP / Controller)</text>
    <text x="810" y="88" text-anchor="middle" fill="#52514e" font-size="12">sees decision with vs without memory</text>
    <text x="810" y="106" text-anchor="middle" fill="#52514e" font-size="12">accepts, or overrides with a note</text>
    <text x="810" y="124" text-anchor="middle" fill="#52514e" font-size="12">"accept up to 2.5%, above that → me"</text>

    <rect x="210" y="240" width="730" height="130" rx="12" fill="#ece9fb" stroke="#6250d6"/>
    <text x="575" y="268" text-anchor="middle" font-weight="700" fill="#6250d6" font-size="15">Hindsight memory bank · munshi-ap-kaveri</text>
    <text x="575" y="292" text-anchor="middle" fill="#0b0b0b" font-size="12">retain_mission: extract vendor, exception, decision, approver, tolerances, clauses, statutory refs</text>
    <text x="575" y="312" text-anchor="middle" fill="#0b0b0b" font-size="12">tags: vendor:V001 · exception:PRICE_VARIANCE · approver:meera-iyer · decision:approved</text>
    <text x="575" y="332" text-anchor="middle" fill="#0b0b0b" font-size="12">directive: never pay on invalid GSTIN or exact duplicate · observations consolidate repeated patterns</text>
    <text x="575" y="354" text-anchor="middle" fill="#52514e" font-size="12">reflect → vendor brief before you pay</text>
  </g>
  <g stroke="#52514e" stroke-width="1.6" fill="none">
    <line x1="170" y1="97" x2="206" y2="97" marker-end="url(#a)"/>
    <line x1="400" y1="97" x2="436" y2="97" marker-end="url(#a)"/>
    <line x1="640" y1="97" x2="676" y2="97" marker-end="url(#a)"/>
  </g>
  <g stroke="#6250d6" stroke-width="1.8" fill="none">
    <path d="M500 236 L500 158" marker-end="url(#m)"/>
    <path d="M810 158 L810 236" marker-end="url(#m)"/>
  </g>
  <text x="508" y="206" fill="#6250d6" font-weight="600">2 · recall ×2</text>
  <text x="508" y="222" fill="#6250d6" font-size="11">vendor + exception pattern</text>
  <text x="818" y="206" fill="#6250d6" font-weight="600">5 · retain</text>
  <text x="818" y="222" fill="#6250d6" font-size="11">dated, tagged decision</text>
</svg>
